# MiniMax-H3 WebUI CI/CD — 部署设计 §4.2 八阶段流水线
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 阶段 1+2：检出 + 依赖安装
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "阶段1: 检出代码"
        uses: actions/checkout@v4

      - name: "阶段2: 安装后端依赖"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "安装 Python 依赖"
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      # 阶段 3：静态检查
      - name: "阶段3: 静态检查 (flake8)"
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --quit-on-error
          flake8 backend/app --count --max-complexity=12 --max-line-length=120 --exit-zero

      # 阶段 4：后端 import / 启动冒烟
      - name: "阶段4: 后端 import 冒烟"
        env:
          DATABASE_URL: sqlite:///./ci_app.db
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python -c "import app.main; print('import OK')"

      # 阶段 5：构建后端镜像
      - name: "阶段5: 构建后端镜像"
        run: docker build -t minimax-h3-backend:ci ./backend

      # 阶段 6：构建前端镜像
      - name: "阶段6: 构建前端镜像"
        run: docker build -t minimax-h3-frontend:ci ./frontend

      # 阶段 7：镜像漏洞扫描（Trivy，失败不阻断）
      - name: "阶段7: 镜像扫描 (Trivy)"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: minimax-h3-backend:ci
          format: table
          exit-code: 0
          severity: HIGH,CRITICAL

      # 阶段 8：汇总
      - name: "阶段8: 汇总"
        run: echo "CI 八阶段全部完成（检出/依赖/静态检查/冒烟/后端镜像/前端镜像/扫描/汇总）"
